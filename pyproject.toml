[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-report"
version = "0.1.0"
description = "Autonomous Discovery Engine for NASA Earth science trends"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "jsonschema>=4.21"]
dev = ["pytest>=8", "jsonschema>=4.21", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Pinned so six people's editors agree; `ruff format` uses this too.
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
