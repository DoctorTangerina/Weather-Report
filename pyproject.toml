[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-report"
version = "0.1.0"
description = "Autonomous Discovery Engine for NASA Earth science trends"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27", "jsonschema>=4.21", "netCDF4>=1.7"]
# ruff is pinned so `ruff check .` gives everyone the same answer (#65).
dev = ["pytest>=8", "jsonschema>=4.21", "httpx>=0.27", "ruff==0.15.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
# Pinned so six people's editors agree; `ruff format` uses this too.
line-length = 88
target-version = "py311"
extend-exclude = [".claude"]

[tool.ruff.lint.per-file-ignores]
# The scripts run from a checkout without installing the package, so they put
# src/ on sys.path before importing it.
"scripts/*.py" = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests", "data/data_processing/tests", "data/data_gathering/tests"]
